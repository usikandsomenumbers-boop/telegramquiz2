<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>⏱️ Real-time Quiz | Telegram Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-card {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            transition: all 0.2s;
        }

        .screen {
            padding: 32px 28px;
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(120deg, #0f2b4d, #1e4a76);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .description {
            color: #334155;
            margin-bottom: 32px;
            line-height: 1.4;
            font-weight: 500;
        }

        .name-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 60px;
            outline: none;
            transition: 0.2s;
            background: #fefcf5;
        }

        .name-input:focus {
            border-color: #1e4a76;
            box-shadow: 0 0 0 3px rgba(30,74,118,0.15);
        }

        .start-btn {
            width: 100%;
            background: #1e4a76;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 24px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .start-btn:active {
            transform: scale(0.97);
            background: #0f3a5c;
        }

        .quiz-header {
            background: #f8fafc;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info {
            font-weight: 600;
            background: #e6f0fa;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 14px;
            color: #0c4e6e;
        }

        .q-counter {
            font-weight: 700;
            background: #1e293b;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 14px;
        }

        .timer-bar-container {
            background: #e2e8f0;
            height: 6px;
            width: 100%;
        }

        .timer-bar {
            background: #ef4444;
            height: 6px;
            width: 100%;
            transition: width 0.1s linear;
        }

        .question-area {
            padding: 28px 24px 20px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 28px;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #1e293b;
        }

        .option:hover {
            background: #e6f0fa;
            border-color: #1e4a76;
            transform: translateX(4px);
        }

        .option:active {
            transform: scale(0.98);
        }

        .thank-screen {
            text-align: center;
        }

        .thank-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .thank-title {
            font-size: 28px;
            font-weight: 800;
            color: #0f2b4d;
            margin-bottom: 12px;
        }

        .thank-text {
            color: #475569;
            font-size: 16px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="quiz-card">
    <!-- NAME SCREEN -->
    <div id="name-screen" class="screen">
        <div class="brand">📋 KNOWLEDGE QUIZ</div>
        <div class="description">30 questions · 15 seconds each · Real-time answers</div>
        <input type="text" id="user-name" class="name-input" placeholder="Enter your full name" autocomplete="off">
        <button class="start-btn" onclick="startQuiz()">▶ START QUIZ</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden">
        <div class="quiz-header">
            <span class="user-info" id="quiz-user-name">Participant</span>
            <span class="q-counter" id="question-counter">Q1/30</span>
        </div>
        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>
        <div class="question-area">
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-grid" id="options"></div>
        </div>
    </div>

    <!-- THANK YOU SCREEN -->
    <div id="thank-screen" class="screen thank-screen hidden">
        <div class="thank-icon">✅</div>
        <div class="thank-title">Quiz Submitted!</div>
        <div class="thank-text" id="thank-text">Your results have been recorded.<br>Thank you for participating.</div>
    </div>
</div>

<script>
    // ======================= TELEGRAM INIT =======================
    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    } else {
        // Fallback for web testing (no Telegram)
        tg = { onEvent: () => {}, offEvent: () => {}, close: () => {} };
    }

    // ======================= QUIZ DATA =======================
    const TOTAL_QUESTIONS = 30;
    const TIME_PER_QUESTION = 15; // seconds
    
    const questions = [
        { q: "What is the capital of France?", options: ["Berlin", "Madrid", "Paris", "Lisbon"], correct: 2 },
        { q: "Which planet is known as the Red Planet?", options: ["Mars", "Jupiter", "Venus", "Saturn"], correct: 0 },
        { q: "Who painted the Mona Lisa?", options: ["Van Gogh", "Picasso", "Da Vinci", "Rembrandt"], correct: 2 },
        { q: "What is the largest ocean on Earth?", options: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
        { q: "Which year did World War II end?", options: ["1943", "1944", "1945", "1946"], correct: 2 },
        { q: "What is the chemical symbol for Gold?", options: ["Go", "Gd", "Au", "Ag"], correct: 2 },
        { q: "Who wrote 'Romeo and Juliet'?", options: ["Charles Dickens", "Jane Austen", "William Shakespeare", "Mark Twain"], correct: 2 },
        { q: "What is the fastest land animal?", options: ["Lion", "Cheetah", "Leopard", "Tiger"], correct: 1 },
        { q: "Which country gifted the Statue of Liberty to the USA?", options: ["England", "Spain", "France", "Germany"], correct: 2 },
        { q: "What is the square root of 64?", options: ["6", "7", "8", "9"], correct: 2 },
        { q: "Who developed the theory of relativity?", options: ["Newton", "Galileo", "Einstein", "Tesla"], correct: 2 },
        { q: "What is the hardest natural substance?", options: ["Iron", "Diamond", "Gold", "Platinum"], correct: 1 },
        { q: "Which instrument is used to measure earthquakes?", options: ["Barometer", "Seismograph", "Thermometer", "Hygrometer"], correct: 1 },
        { q: "What is the tallest mountain in the world?", options: ["K2", "Kangchenjunga", "Everest", "Makalu"], correct: 2 },
        { q: "Which blood type is known as the universal donor?", options: ["A", "B", "AB", "O"], correct: 3 },
        { q: "Who painted 'Starry Night'?", options: ["Monet", "Degas", "Van Gogh", "Cezanne"], correct: 2 },
        { q: "What is the smallest prime number?", options: ["0", "1", "2", "3"], correct: 2 },
        { q: "Which country is famous for the Great Wall?", options: ["India", "Japan", "China", "Korea"], correct: 2 },
        { q: "What gas do plants absorb from the air?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: 2 },
        { q: "Who is known as the 'Father of Computers'?", options: ["Alan Turing", "Charles Babbage", "Bill Gates", "Steve Jobs"], correct: 1 },
        { q: "Which animal is known as the 'Ship of Desert'?", options: ["Horse", "Camel", "Elephant", "Giraffe"], correct: 1 },
        { q: "What is the currency of Japan?", options: ["Yuan", "Won", "Yen", "Dollar"], correct: 2 },
        { q: "Which vitamin is produced by the human skin when exposed to sunlight?", options: ["A", "C", "D", "E"], correct: 2 },
        { q: "Who wrote 'The Odyssey'?", options: ["Sophocles", "Homer", "Euripides", "Aristotle"], correct: 1 },
        { q: "What is the longest river in the world?", options: ["Amazon", "Nile", "Yangtze", "Mississippi"], correct: 1 },
        { q: "Which element has the chemical symbol 'O'?", options: ["Osmium", "Oxygen", "Gold", "Silver"], correct: 1 },
        { q: "Who painted the Sistine Chapel ceiling?", options: ["Donatello", "Raphael", "Michelangelo", "Leonardo"], correct: 2 },
        { q: "What is the capital of Canada?", options: ["Toronto", "Vancouver", "Ottawa", "Montreal"], correct: 2 },
        { q: "Which is the largest continent by area?", options: ["Africa", "Asia", "North America", "Europe"], correct: 1 },
        { q: "Who invented the light bulb?", options: ["Edison", "Tesla", "Bell", "Newton"], correct: 0 }
    ];

    // ======================= STATE =======================
    let userName = '';
    let currentQuestion = 0;
    let timerInterval = null;
    let sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    let quizActive = true;
    let answersSentForQuestions = new Set(); // track answered questions to avoid double send
    
    // Google Script URL (YOUR DEPLOYED WEB APP URL)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBUXnjXVmhqf8UMeOEOmYH73Al0543ifvK1_-Hp85AoF_Zhxvt3n5wWrzYkV-Qbz4XlA/exec";

    // ======================= HELPER: SEND TO GOOGLE SCRIPT =======================
    async function sendToGoogleScript(action, additionalData = {}) {
        if (!quizActive && action !== 'quiz_closed') return; // prevent sending after finish
        
        const payload = {
            action: action,
            sessionId: sessionId,
            userName: userName,
            ...additionalData
        };
        
        try {
            // using no-cors for simplicity, but script will still receive POST
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                mode: 'no-cors'
            });
        } catch (err) {
            console.warn("Send error:", err);
        }
    }
    
    // ======================= SUBMIT ANSWER (REAL-TIME) =======================
    async function submitAnswer(selectedIndex, answerText, isCorrect) {
        if (!quizActive) return;
        if (answersSentForQuestions.has(currentQuestion)) return; // prevent duplicate
        
        const q = questions[currentQuestion];
        const userAnswerText = answerText || "⏰ Not answered";
        const correctness = (selectedIndex !== undefined && selectedIndex === q.correct);
        
        // mark as sent
        answersSentForQuestions.add(currentQuestion);
        
        await sendToGoogleScript("submit_answer", {
            questionIndex: currentQuestion,
            questionText: q.q,
            userAnswer: userAnswerText,
            correctAnswer: q.options[q.correct],
            isCorrect: correctness
        });
        
        // Move to next question after answer
        clearTimer();
        currentQuestion++;
        
        if (currentQuestion < TOTAL_QUESTIONS) {
            loadQuestion();
        } else {
            // quiz naturally finished
            await finishQuiz(true);
        }
    }
    
    // ======================= TIME EXPIRED =======================
    function onTimeExpired() {
        if (!quizActive) return;
        if (answersSentForQuestions.has(currentQuestion)) return;
        
        // Send "Not answered" for this question
        const q = questions[currentQuestion];
        const notAnsweredText = "⏰ Not answered";
        
        sendToGoogleScript("submit_answer", {
            questionIndex: currentQuestion,
            questionText: q.q,
            userAnswer: notAnsweredText,
            correctAnswer: q.options[q.correct],
            isCorrect: false
        }).then(() => {
            answersSentForQuestions.add(currentQuestion);
            clearTimer();
            currentQuestion++;
            
            if (currentQuestion < TOTAL_QUESTIONS) {
                loadQuestion();
            } else {
                finishQuiz(true);
            }
        }).catch(() => {
            // still move forward
            clearTimer();
            currentQuestion++;
            if (currentQuestion < TOTAL_QUESTIONS) {
                loadQuestion();
            } else {
                finishQuiz(true);
            }
        });
    }
    
    // ======================= TIMER MANAGEMENT =======================
    let timeLeft = TIME_PER_QUESTION;
    
    function startProgressBar() {
        timeLeft = TIME_PER_QUESTION;
        const bar = document.getElementById('timer-bar');
        clearTimer();
        
        timerInterval = setInterval(() => {
            if (!quizActive) return;
            if (timeLeft <= 0) {
                clearTimer();
                onTimeExpired();
            } else {
                timeLeft -= 0.1;
                const percent = (timeLeft / TIME_PER_QUESTION) * 100;
                bar.style.width = Math.max(0, percent) + '%';
                if (percent < 30) {
                    bar.style.backgroundColor = '#dc2626';
                } else {
                    bar.style.backgroundColor = '#ef4444';
                }
            }
        }, 100);
    }
    
    function clearTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    // ======================= LOAD QUESTION =======================
    function loadQuestion() {
        if (!quizActive) return;
        if (currentQuestion >= TOTAL_QUESTIONS) return;
        
        const q = questions[currentQuestion];
        document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.q}`;
        document.getElementById('question-counter').innerText = `Q${currentQuestion+1}/${TOTAL_QUESTIONS}`;
        
        const optsDiv = document.getElementById('options');
        optsDiv.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => {
                if (!quizActive) return;
                if (answersSentForQuestions.has(currentQuestion)) return;
                clearTimer();
                const isAnsCorrect = (idx === q.correct);
                submitAnswer(idx, opt, isAnsCorrect);
            };
            optsDiv.appendChild(btn);
        });
        
        startProgressBar();
    }
    
    // ======================= FINISH QUIZ (COMPLETED OR EARLY CLOSE) =======================
    async function finishQuiz(isCompleted = true) {
        if (!quizActive) return;
        quizActive = false;
        clearTimer();
        
        // Send final status: quiz_finished or quiz_closed
        // If completed normally -> quiz_finished
        // If closed early but we call this due to beforeunload -> quiz_closed
        const actionType = isCompleted ? "quiz_finished" : "quiz_closed";
        
        await sendToGoogleScript(actionType, {});
        
        // Show thank you screen
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('thank-screen').classList.remove('hidden');
        
        if (isCompleted) {
            document.getElementById('thank-text').innerHTML = "✅ Quiz completed!<br>Your report is being processed and will be sent to the group.";
        } else {
            document.getElementById('thank-text').innerHTML = "⚠️ You closed the quiz early.<br>Partial results have been submitted to the group.";
        }
        
        // Close Telegram Mini App after short delay (optional)
        setTimeout(() => {
            if (tg && typeof tg.close === 'function') {
                tg.close();
            }
        }, 3000);
    }
    
    // ======================= HANDLE EARLY CLOSE (beforeunload & Telegram close) =======================
    let closeHandled = false;
    
    async function handleEarlyClose() {
        if (closeHandled) return;
        if (!quizActive) return;
        if (document.getElementById('quiz-screen') && document.getElementById('quiz-screen').classList.contains('hidden')) {
            // not in quiz screen, maybe already finished
            return;
        }
        closeHandled = true;
        quizActive = false;
        clearTimer();
        
        // Send quiz_closed to Google Script so it can mark all unanswered questions
        // Google Script will treat unanswered questions as "Not answered" when generating PDF
        await sendToGoogleScript("quiz_closed", {});
        
        // small delay to ensure fetch is sent before page unload
        await new Promise(resolve => setTimeout(resolve, 150));
    }
    
    // ======================= START QUIZ =======================
    async function startQuiz() {
        const nameInput = document.getElementById('user-name');
        const nameValue = nameInput.value.trim();
        if (!nameValue) {
            alert("Please enter your full name to start the quiz.");
            return;
        }
        userName = nameValue;
        
        // Reset state
        currentQuestion = 0;
        answersSentForQuestions.clear();
        quizActive = true;
        closeHandled = false;
        sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        
        // Notify Google Script: session started
        await sendToGoogleScript("start_quiz", {});
        
        // Update UI
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('thank-screen').classList.add('hidden');
        document.getElementById('quiz-user-name').innerText = `👤 ${userName}`;
        
        // Start first question
        loadQuestion();
    }
    
    // ======================= DETECT EARLY CLOSURE =======================
    // For page refresh or tab close
    window.addEventListener('beforeunload', (e) => {
        if (quizActive && !document.getElementById('thank-screen').classList.contains('hidden') === false) {
            handleEarlyClose();
        }
    });
    
    // For visibility change (optional: if app gets killed in background, but Telegram handles)
    // Also detect Telegram's close event if available
    if (tg && typeof tg.onEvent === 'function') {
        tg.onEvent('viewportChanged', () => {
            // Telegram might be closing
            if (tg.isClosing) {
                handleEarlyClose();
            }
        });
        // fallback for back button
        tg.onEvent('backButtonClicked', () => {
            handleEarlyClose();
        });
    }
    
    // Expose start function globally
    window.startQuiz = startQuiz;
</script>
</body>
</html>
