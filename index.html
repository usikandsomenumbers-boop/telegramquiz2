<!DOCTYPE html>
<html lang="en">
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let userName = '';
  let currentQuestion = 0;
  let timerInterval;
  let sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFeA1heTX6AxVqVh_WqIUo8oiF6gzoM3ghscRKI8tRCMvniQJ1mydyGqbbS2KaeltTQQ/exec";

  const questions = [ /* ... your 30 questions remain the same ... */ ];

  // Start Quiz
  function startQuiz() {
    userName = document.getElementById('user-name').value.trim();
    if (!userName) return alert("Name is required!");

    document.getElementById('name-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';

    // Notify Google Script that quiz started
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: "start_quiz",
        sessionId: sessionId,
        userName: userName
      }),
      mode: 'no-cors'
    });

    loadQuestion();
  }

  // Load Question (same as before)
  function loadQuestion() {
    if (currentQuestion >= questions.length) {
      submitQuiz(true);
      return;
    }

    const q = questions[currentQuestion];
    document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.q}`;

    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';

    q.options.forEach((opt, i) => {
      const btn = document.createElement('div');
      btn.className = 'option';
      btn.innerText = opt;
      btn.onclick = () => selectAnswer(i);
      optsDiv.appendChild(btn);
    });

    startProgressBar();
  }

  function startProgressBar() {
    const bar = document.getElementById('progress-bar');
    let timeLeft = 10;
    bar.style.width = '100%';
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      bar.style.width = (timeLeft / 10 * 100) + '%';

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        submitAnswer(null); // Time expired
      }
    }, 100);
  }

  function selectAnswer(selected) {
    clearInterval(timerInterval);
    const q = questions[currentQuestion];
    submitAnswer(selected, q.options[selected], selected === q.correct);
  }

  // Send answer immediately
  function submitAnswer(selectedIndex, userAnswerText, isCorrect) {
    const q = questions[currentQuestion];

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: "submit_answer",
        sessionId: sessionId,
        questionIndex: currentQuestion,
        questionText: q.q,
        userAnswer: userAnswerText || "⏰ Time Expired",
        correctAnswer: q.options[q.correct],
        isCorrect: isCorrect || false
      }),
      mode: 'no-cors'
    });

    currentQuestion++;
    loadQuestion();
  }

  // Final submission
  function submitQuiz(isCompleted = true) {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('thank-screen').style.display = 'block';

    const action = isCompleted ? "quiz_finished" : "quiz_closed";

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: action,
        sessionId: sessionId,
        userName: userName
      }),
      mode: 'no-cors'
    }).then(() => {
      document.getElementById('thank-title').innerHTML = "✅ Thank you!";
      document.getElementById('thank-text').innerHTML = "Your result has been sent to the group.";
    });
  }

  // Detect when user closes the Mini App
  tg.onEvent('viewportChanged', () => {
    if (tg.isClosing) {
      submitQuiz(false);   // Send partial result if they close early
    }
  });

  // Optional: Also catch back button or close
  window.addEventListener('beforeunload', () => {
    submitQuiz(false);
  });
</script>
</body>
</html>
