<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Quiz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --primary: #229ED9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e2937);
      color: white;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    .screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .active { display: flex; }

    /* Name Screen */
    #name-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #fff;
    }

    .input-group {
      margin: 30px 0;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      background: rgba(255,255,255,0.1);
      color: white;
      backdrop-filter: blur(10px);
    }

    input::placeholder { color: rgba(255,255,255,0.6); }

    button {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:active {
      transform: scale(0.98);
      background: #1e8bc4;
    }

    /* Quiz Screen */
    #quiz-screen {
      flex-direction: column;
    }

    .progress-container {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      margin: 15px 0;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #22d3ee, #229ED9);
      width: 100%;
      transition: width 0.1s linear;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 16px;
      opacity: 0.9;
    }

    #question-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    .option {
      background: rgba(255,255,255,0.08);
      padding: 16px 20px;
      margin: 10px 0;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .option:hover {
      background: rgba(255,255,255,0.15);
    }

    .option:active {
      transform: translateY(2px);
    }

    /* Thank you screen */
    #thank-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .thank-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Name Screen -->
  <div id="name-screen" class="screen active">
    <div class="container">
      <h1>Knowledge Quiz</h1>
      <p style="margin: 15px 0 30px; opacity: 0.8;">Enter your name to begin</p>
      
      <div class="input-group">
        <input type="text" id="user-name" placeholder="Your full name" autocomplete="off" />
      </div>
      
      <button onclick="startQuiz()">Start Quiz</button>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen">
    <div class="container">
      <div class="question-header">
        <span id="question-counter">1 / 30</span>
        <span id="timer">15s</span>
      </div>
      
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>

      <div id="question-text"></div>
      <div id="options"></div>
    </div>
  </div>

  <!-- Thank You Screen -->
  <div id="thank-screen" class="screen">
    <div class="container">
      <div class="thank-icon">✅</div>
      <h1 id="thank-title">Thank You!</h1>
      <p id="thank-text" style="margin-top: 15px; opacity: 0.9;">
        Your answers have been recorded and sent.
      </p>
    </div>
  </div>

<script>
// ============== CONFIGURATION ==============
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFeA1heTX6AxVqVh_WqIUo8oiF6gzoM3ghscRKI8tRCMvniQJ1mydyGqbbS2KaeltTQQ/exec";

let userName = '';
let currentQuestion = 0;
let timerInterval;
let sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
let tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

// ============== QUESTIONS (Add your 30 questions here) ==============
const questions = [
  // Example format:
  // { q: "What is the capital of France?", options: ["London", "Berlin", "Paris", "Madrid"], correct: 2 },
  // Add all your 30 questions here in the same format
  // ... your 30 questions ...
];

// ============== CORE FUNCTIONS ==============
function startQuiz() {
  userName = document.getElementById('user-name').value.trim();
  if (!userName) {
    alert("Please enter your name!");
    return;
  }

  document.getElementById('name-screen').classList.remove('active');
  document.getElementById('quiz-screen').classList.add('active');

  // Notify Google Script
  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: "start_quiz", sessionId, userName }),
    mode: 'no-cors'
  });

  loadQuestion();
}

function loadQuestion() {
  if (currentQuestion >= questions.length) {
    submitQuiz(true);
    return;
  }

  const q = questions[currentQuestion];
  
  document.getElementById('question-counter').textContent = `${currentQuestion + 1} / ${questions.length}`;
  document.getElementById('question-text').innerHTML = q.q;

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optsDiv.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  let timeLeft = 15;
  const progressBar = document.getElementById('progress-bar');
  const timerEl = document.getElementById('timer');

  progressBar.style.width = '100%';
  timerEl.textContent = '15s';

  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    progressBar.style.width = (timeLeft / 15 * 100) + '%';
    timerEl.textContent = Math.ceil(timeLeft) + 's';

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitAnswer(null); // Time expired
    }
  }, 100);
}

function selectAnswer(selectedIndex) {
  clearInterval(timerInterval);
  const q = questions[currentQuestion];
  const isCorrect = selectedIndex === q.correct;
  
  submitAnswer(selectedIndex, q.options[selectedIndex], isCorrect);
}

function submitAnswer(selectedIndex, userAnswerText = null, isCorrect = false) {
  const q = questions[currentQuestion];

  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: "submit_answer",
      sessionId: sessionId,
      questionIndex: currentQuestion,
      questionText: q.q,
      userAnswer: userAnswerText || "⏰ Time Expired",
      correctAnswer: q.options[q.correct],
      isCorrect: isCorrect
    }),
    mode: 'no-cors'
  });

  currentQuestion++;
  loadQuestion();
}

function submitQuiz(isCompleted = true) {
  document.getElementById('quiz-screen').classList.remove('active');
  document.getElementById('thank-screen').classList.add('active');

  const action = isCompleted ? "quiz_finished" : "quiz_closed";

  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: action,
      sessionId: sessionId,
      userName: userName
    }),
    mode: 'no-cors'
  });
}

// ============== TELEGRAM EVENTS ==============
tg.onEvent('viewportChanged', () => {
  if (tg.isClosing) {
    submitQuiz(false);
  }
});

window.addEventListener('beforeunload', () => {
  submitQuiz(false);
});

// Optional: Handle back button
tg.BackButton.onClick(() => {
  submitQuiz(false);
  tg.close();
});

// Start
</script>
</body>
</html>
