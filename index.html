<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ELD Quiz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
    }
    .container { max-width: 420px; margin: 40px auto 0; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: #aaaaaa; margin-bottom: 20px; }
    input, button {
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 15px;
      border-radius: 16px;
      font-size: 17px;
      box-sizing: border-box;
    }
    input { background: #1f1f1f; color: white; border: none; }
    button {
      background: #229ED9;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #1a8ac4; }
    .difficulty-btn {
      background: #1f1f1f;
      color: white;
      font-size: 18px;
      padding: 18px;
      margin: 12px 0;
      border-radius: 16px;
      font-weight: 500;
    }
    .difficulty-btn.medium { border-left: 6px solid #FF9800; }
    .difficulty-btn.hard { border-left: 6px solid #F44336; }
    .option {
      background: #1f1f1f;
      margin: 10px 0;
      padding: 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }
    .option:hover { background: #2a2a2a; }
    #progress-container {
      height: 12px;
      background: #333;
      border-radius: 10px;
      margin: 25px 0;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: #ff4444;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

  <!-- Name Screen -->
  <div id="name-screen" class="container">
    <h1>📝 ELD Quiz</h1>
    <p>Please enter your full name</p>
    <input id="user-name" type="text" placeholder="Your Full Name">
    <button onclick="showDifficultyScreen()">Continue</button>
  </div>

  <!-- Difficulty Screen -->
  <div id="difficulty-screen" class="container" style="display: none;">
    <h1>Choose Difficulty</h1>
    <p>Select your level</p>
    <button class="difficulty-btn medium" onclick="startQuiz('medium')">🟠 Medium</button>
    <button class="difficulty-btn hard" onclick="startQuiz('hard')">🔴 Hard</button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" style="display: none;" class="container">
    <h2 id="question-text"></h2>
    <div id="progress-container">
      <div id="progress-bar" style="width:100%"></div>
    </div>
    <div id="options"></div>
    <p style="color:#666; margin-top:15px;">Difficulty: <span id="current-difficulty"></span></p>
  </div>

  <!-- Thank You Screen -->
  <div id="thank-screen" style="display: none;" class="container">
    <h1 id="thank-title">Processing...</h1>
    <p id="thank-text">Please wait while we save your result</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMdneH__zX-tO5ljqaGrWUswbG-ep0qa-vPgJYAujB/dev";

    let userName = '';
    let currentQuestion = 0;
    let timerInterval;
    let answers = [];
    let selectedDifficulty = '';
    let quizStarted = false;

    const questionsByDifficulty = {
      medium: [
        { q: "You arrive at a scale and an officer approaches your truck. Your status is OFF duty. What should you do first?",
          options: ["Stay OFF duty", "Switch to On Duty immediately", "Switch to Sleeper Berth", "Start driving"],
          correct: 1 },
        { q: "Your ELD freezes while driving. What is the correct action?",
          options: ["Keep driving and fix later", "Restart and continue without logs", "Switch to paper logs and notify company", "Ignore it"],
          correct: 2 },
        { q: "You just finished fueling and forgot to change status from Driving. What should you do?",
          options: ["Leave it", "Delete the log", "Edit to On Duty (fuel)", "Restart ELD"],
          correct: 2 }
      ],
      hard: [
        { q: "During a roadside inspection, the officer requests your ELD data for the past 7 days but your device only shows current day logs. What is the likely outcome?",
          options: ["No violation", "HOS violation and possible fine", "Only a warning", "Device must be reset"],
          correct: 1 },
        { q: "You are using Personal Conveyance (PC) while your truck is loaded with cargo going to a delivery. Is this allowed?",
          options: ["Yes, always allowed", "No, this is a violation", "Only if distance is under 10 miles", "Only with dispatcher approval"],
          correct: 1 },
        { q: "Your ELD shows a malfunction for more than 24 hours. What must you do according to FMCSA rules?",
          options: ["Continue driving normally", "Switch to paper logs and repair within 8 days", "Ignore until next inspection", "Buy a new ELD immediately"],
          correct: 1 }
      ]
    };

    // Auto-submit when user closes the mini app
    window.addEventListener('pagehide', () => { if (quizStarted) autoSubmitOnClose(); });
    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && quizStarted) autoSubmitOnClose();
    });

    function showDifficultyScreen() {
      userName = document.getElementById('user-name').value.trim();
      if (!userName) return alert("Please enter your full name!");
      document.getElementById('name-screen').style.display = 'none';
      document.getElementById('difficulty-screen').style.display = 'block';
    }

    function startQuiz(difficulty) {
      selectedDifficulty = difficulty;
      currentQuestion = 0;
      answers = [];
      quizStarted = true;

      document.getElementById('difficulty-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      document.getElementById('current-difficulty').innerText = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);

      loadQuestion();
    }

    function loadQuestion() {
      const qs = questionsByDifficulty[selectedDifficulty];
      if (currentQuestion >= qs.length) {
        submitQuiz();
        return;
      }

      const q = qs[currentQuestion];
      document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.q}`;

      const optsDiv = document.getElementById('options');
      optsDiv.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(i);
        optsDiv.appendChild(btn);
      });

      startProgressBar();
    }

    function startProgressBar() {
      const bar = document.getElementById('progress-bar');
      let timeLeft = 15;
      bar.style.width = '100%';
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        bar.style.width = Math.max(0, (timeLeft / 15) * 100) + '%';

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          answers.push({ qIndex: currentQuestion, answer: null, correct: false });
          currentQuestion++;
          loadQuestion();
        }
      }, 100);
    }

    function selectAnswer(selected) {
      clearInterval(timerInterval);
      const qs = questionsByDifficulty[selectedDifficulty];
      const q = qs[currentQuestion];

      answers.push({
        qIndex: currentQuestion,
        answer: q.options[selected],
        correct: selected === q.correct
      });

      currentQuestion++;
      loadQuestion();
    }

    function submitQuiz() {
      if (!quizStarted) return;
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('thank-screen').style.display = 'block';
      fillUnansweredQuestions();
      sendToGoogle(false);
    }

    function autoSubmitOnClose() {
      if (!quizStarted) return;
      fillUnansweredQuestions();
      sendToGoogle(true);
    }

    function fillUnansweredQuestions() {
      const total = questionsByDifficulty[selectedDifficulty].length;
      while (answers.length < total) {
        answers.push({ qIndex: answers.length, answer: null, correct: false });
      }
    }

    function sendToGoogle(isForced) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const submissionDate = new Date().toLocaleString('en-US', {
        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      const qs = questionsByDifficulty[selectedDifficulty];
      const correctCount = answers.filter(a => a.correct === true).length;
      const scorePercent = Math.round((correctCount / qs.length) * 100);

      // PDF Creation
      doc.setFillColor(34, 158, 217);
      doc.rect(0, 0, 210, 45, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(24);
      doc.text(`${selectedDifficulty.toUpperCase()} QUIZ RESULT`, 105, 28, { align: "center" });

      doc.setTextColor(0, 0, 0);
      doc.setFontSize(16);
      doc.text(`Participant: ${userName}`, 20, 65);
      doc.text(`Difficulty: ${selectedDifficulty}`, 20, 75);
      doc.text(`Submitted: ${submissionDate}`, 20, 85);

      if (isForced) {
        doc.setTextColor(200, 50, 50);
        doc.text("⚠️ Quiz closed before completion", 20, 100);
      }

      doc.setFillColor(240, 240, 240);
      doc.rect(20, 115, 170, 35, 'F');
      doc.setFontSize(18);
      doc.setTextColor(34, 158, 217);
      doc.text(`Score: ${correctCount}/${qs.length} (${scorePercent}%)`, 105, 133, { align: "center" });

      let y = 165;
      answers.forEach((ans, i) => {
        const q = qs[i];
        const userAnswer = ans.answer || "⏰ Not Answered";

        const questionLines = doc.splitTextToSize(`${i+1}. ${q.q}`, 170);
        doc.text(questionLines, 20, y);
        y += questionLines.length * 8;

        doc.setFontSize(11);
        doc.setTextColor(ans.correct ? 0 : 200, ans.correct ? 150 : 50, 0);
        doc.text(ans.correct ? `✓ ${userAnswer}` : `✕ ${userAnswer}`, 25, y);
        y += 12;

        doc.setTextColor(80, 80, 80);
        doc.text(`Correct: ${q.options[q.correct]}`, 25, y);
        y += 20;

        if (y > 270) {
          doc.addPage();
          y = 30;
        }
      });

      const pdfBase64 = doc.output('datauristring').split(',')[1];

      const payload = {
        userName: userName,
        difficulty: selectedDifficulty,
        correctAnswers: correctCount,
        totalQuestions: qs.length,
        scorePercent: scorePercent,
        pdfBase64: pdfBase64,
        submissionDate: submissionDate,
        completed: !isForced
      };

      const jsonString = JSON.stringify(payload);
      const blob = new Blob([jsonString], { type: 'application/json' });

      // Best effort to send when closing
      navigator.sendBeacon(GOOGLE_SCRIPT_URL, blob);

      // Fallback
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: jsonString,
        keepalive: true,
        mode: 'no-cors'
      }).catch(() => {});
    }
  </script>
</body>
</html>
