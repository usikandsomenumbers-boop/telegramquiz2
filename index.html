<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Knowledge Quiz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root { --primary: #229ED9; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e2937);
      color: white;
      min-height: 100vh;
    }

    .container { max-width: 480px; margin: 0 auto; padding: 20px; }

    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .active { display: flex; }

    h1 { font-size: 28px; margin-bottom: 10px; text-align: center; }

    /* Name Screen */
    #name-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      background: rgba(255,255,255,0.1);
      color: white;
      margin: 25px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.98); }

    /* Quiz Screen */
    .question-header {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    #progress-bar-container {
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #22d3ee, #229ED9);
      width: 100%;
      transition: width 0.1s linear;
    }

    #question-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    .option {
      background: rgba(255,255,255,0.08);
      padding: 16px 20px;
      margin: 10px 0;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option:active {
      background: rgba(255,255,255,0.25);
      transform: translateY(2px);
    }

    /* Thank Screen */
    #thank-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .thank-icon { font-size: 70px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Name Screen -->
  <div id="name-screen" class="screen active">
    <div class="container">
      <h1>Knowledge Quiz</h1>
      <p style="margin: 15px 0 30px; opacity: 0.8;">Enter your name to begin the test</p>
      <input type="text" id="user-name" placeholder="Your Full Name" autocomplete="off" />
      <button onclick="startQuiz()">Start Quiz</button>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen">
    <div class="container">
      <div class="question-header">
        <span id="question-counter">1 / 5</span>
        <span id="timer">15s</span>
      </div>
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>

      <div id="question-text"></div>
      <div id="options"></div>
    </div>
  </div>

  <!-- Thank You Screen -->
  <div id="thank-screen" class="screen">
    <div class="container">
      <div class="thank-icon">✅</div>
      <h1>Thank You!</h1>
      <p id="thank-text" style="margin-top: 15px; opacity: 0.9;">
        Your answers have been sent successfully.<br>
        Check the Telegram group for results.
      </p>
    </div>
  </div>

<script>
// ============== CONFIGURATION ==============
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxLuWbBF7b_6vY2jRw7MsxMesUQSvOd13X-vzxnCqdlG8yVMhZd4GImm2Dw_SLmKmDpA/exec";

let userName = '';
let currentQuestion = 0;
let timerInterval;
let sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ============== 5 TEST QUESTIONS ==============
const questions = [
  {
    q: "What is the capital of France?",
    options: ["London", "Berlin", "Paris", "Madrid"],
    correct: 2
  },
  {
    q: "Which planet is known as the Red Planet?",
    options: ["Venus", "Mars", "Jupiter", "Saturn"],
    correct: 1
  },
  {
    q: "What is the largest ocean on Earth?",
    options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"],
    correct: 3
  },
  {
    q: "Who painted the Mona Lisa?",
    options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Michelangelo"],
    correct: 2
  },
  {
    q: "What is the chemical symbol for Gold?",
    options: ["Go", "Gd", "Au", "Ag"],
    correct: 2
  }
];

// ============== CORE FUNCTIONS ==============
function startQuiz() {
  userName = document.getElementById('user-name').value.trim();
  if (!userName) {
    alert("Please enter your name!");
    return;
  }

  document.getElementById('name-screen').classList.remove('active');
  document.getElementById('quiz-screen').classList.add('active');

  // Notify Google Script that quiz started
  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: "start_quiz", sessionId: sessionId, userName: userName }),
    mode: 'no-cors'
  });

  loadQuestion();
}

function loadQuestion() {
  if (currentQuestion >= questions.length) {
    submitQuiz(true);
    return;
  }

  const q = questions[currentQuestion];
  
  document.getElementById('question-counter').textContent = `${currentQuestion + 1} / ${questions.length}`;
  document.getElementById('question-text').innerText = q.q;

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.innerText = opt;
    btn.onclick = () => selectAnswer(i);
    optsDiv.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  let timeLeft = 15;
  const progressBar = document.getElementById('progress-bar');
  const timerEl = document.getElementById('timer');

  progressBar.style.width = '100%';
  timerEl.textContent = '15s';

  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    progressBar.style.width = (timeLeft / 15 * 100) + '%';
    timerEl.textContent = Math.ceil(timeLeft) + 's';

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitAnswer(null); // Time expired
    }
  }, 100);
}

function selectAnswer(selectedIndex) {
  clearInterval(timerInterval);
  const q = questions[currentQuestion];
  const isCorrect = selectedIndex === q.correct;

  submitAnswer(selectedIndex, q.options[selectedIndex], isCorrect);
}

function submitAnswer(selectedIndex, userAnswerText = null, isCorrect = false) {
  const q = questions[currentQuestion];

  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: "submit_answer",
      sessionId: sessionId,
      questionIndex: currentQuestion,
      questionText: q.q,
      userAnswer: userAnswerText || "⏰ Time Expired",
      correctAnswer: q.options[q.correct],
      isCorrect: isCorrect
    }),
    mode: 'no-cors'
  });

  currentQuestion++;
  loadQuestion();
}

function submitQuiz(isCompleted = true) {
  document.getElementById('quiz-screen').classList.remove('active');
  document.getElementById('thank-screen').classList.add('active');

  const action = isCompleted ? "quiz_finished" : "quiz_closed";

  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: action,
      sessionId: sessionId,
      userName: userName
    }),
    mode: 'no-cors'
  });
}

// ============== TELEGRAM EVENTS ==============
tg.onEvent('viewportChanged', () => {
  if (tg.isClosing) submitQuiz(false);
});

window.addEventListener('beforeunload', () => submitQuiz(false));

</script>
</body>
</html>
