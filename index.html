<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 420px; margin: 40px auto 0; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: #aaaaaa; margin-bottom: 30px; }
    input, button {
      width: 100%; padding: 16px 20px; margin-bottom: 20px; border-radius: 16px; font-size: 17px; box-sizing: border-box;
    }
    input { background: #1f1f1f; color: white; border: none; }
    button { background: #229ED9; color: white; border: none; font-weight: 600; }
    button:active { background: #1a8ac4; }

    #progress-container { height: 12px; background: #333; border-radius: 10px; margin: 20px 0; overflow: hidden; }
    #progress-bar { height: 100%; width: 100%; background: linear-gradient(to right, #4CAF50, #ffeb3b, #ff4444); transition: width 0.2s linear; }
    .option { background: #1f1f1f; margin: 10px 0; padding: 16px; border-radius: 12px; text-align: left; font-size: 16px; }
  </style>
</head>
<body>
  <div id="name-screen" class="container">
    <h1>📝 Quiz</h1>
    <p>Please enter your full name to start</p>
    <input id="user-name" type="text" placeholder="Your Full Name">
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <div id="quiz-screen" style="display: none;" class="container">
    <h2 id="question-text"></h2>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="options"></div>
  </div>

  <div id="thank-screen" style="display: none;" class="container">
    <h1>✅ Thank you!</h1>
    <p>Your answers have been submitted.</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let userName = '';
    let currentQuestion = 0;
    let timerInterval;
    let answers = [];

    const questions = [
      { q: "It is only a test please press correct answer", options: ["correct", "incorrect"], correct: 0 },
      { q: "What is the capital of Uzbekistan?", options: ["Tashkent", "Samarkand", "Bukhara", "Andijan"], correct: 0 },
      { q: "How many seconds is the timer for each question?", options: ["10 seconds", "15 seconds", "20 seconds", "30 seconds"], correct: 1 },
      { q: "What is 15 + 15?", options: ["25", "30", "20", "35"], correct: 1 },
      { q: "Will I get bonus for it? 😊", options: ["Yes", "No", "Maybe", "Only if I smile"], correct: 0 }
    ];

    function startQuiz() {
      userName = document.getElementById('user-name').value.trim();
      if (!userName) { alert("Name is required!"); return; }
      document.getElementById('name-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestion >= questions.length) {
        submitAutomatically();
        return;
      }
      const q = questions[currentQuestion];
      document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.q}`;

      const optsDiv = document.getElementById('options');
      optsDiv.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(i);
        optsDiv.appendChild(btn);
      });
      startProgressBar();
    }

    function startProgressBar() {
      const progressBar = document.getElementById('progress-bar');
      let timeLeft = 15;
      progressBar.style.width = '100%';
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        const percentage = (timeLeft / 15) * 100;
        progressBar.style.width = percentage + '%';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          answers.push({ qIndex: currentQuestion, answer: null, correct: false });
          currentQuestion++;
          loadQuestion();
        }
      }, 100);
    }

    function selectAnswer(selected) {
      clearInterval(timerInterval);
      const q = questions[currentQuestion];
      answers.push({
        qIndex: currentQuestion,
        answer: q.options[selected],
        correct: selected === q.correct
      });
      currentQuestion++;
      loadQuestion();
    }

    function submitAutomatically() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('thank-screen').style.display = 'block';
      generateAndSendPDF();
    }

    function generateAndSendPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

      // Title
      doc.setFontSize(20);
      doc.text(`Quiz Results`, 105, 20, { align: 'center' });
      doc.setFontSize(14);
      doc.text(`${userName} - ${dateStr} ${timeStr}`, 105, 30, { align: 'center' });

      let y = 50;
      doc.setFontSize(12);

      answers.forEach((ans, i) => {
        const q = questions[i];
        const status = ans.correct ? "✅ Correct" : "❌ Wrong";

        doc.text(`${i+1}. ${q.q}`, 20, y);
        y += 10;
        doc.text(`Your Answer: ${ans.answer || '⏰ Time expired'}`, 30, y);
        y += 8;
        doc.text(`Correct Answer: ${q.options[q.correct]}`, 30, y);
        y += 8;
        doc.text(status, 30, y);
        y += 18;
      });

      doc.setFontSize(14);
      const score = answers.filter(a => a.correct).length;
      doc.text(`Final Score: ${score} / ${questions.length}`, 20, y + 10);

      const pdfBase64 = doc.output('datauristring').split(',')[1];

      const payload = JSON.stringify({
        userName: userName,
        date: dateStr,
        time: timeStr,
        answers: answers,
        totalQuestions: questions.length,
        pdfBase64: pdfBase64
      });

      tg.sendData(payload);
      tg.close();
    }
  </script>
</body>
</html>
